# Render "Blueprint": repoyu bağlayınca Render bu dosyadan her şeyi otomatik kurar.
# Bot bir Background Worker olarak çalışır; veritabanı kalıcı diskte (/var/data) saklanır.
services:
  - type: worker
    name: jester-game-bot
    runtime: node
    plan: starter
    buildCommand: npm install
    startCommand: npm run start:render
    autoDeploy: true
    disk:
      name: jester-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: NODE_VERSION
        value: 22.14.0
      - key: DATA_DIR
        value: /var/data
      - key: DISCORD_TOKEN
        sync: false
      - key: DISCORD_CLIENT_ID
        sync: false
      - key: DISCORD_GUILD_ID
        sync: false
